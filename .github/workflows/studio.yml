# The cloud studio: vinari.ge/studio dispatches this with a category and a topic (either may be empty: no
# category and no topic is the dice, the least-used category), and gets back a finished
# promo film, its designed Reels cover and its post text, rendered here with the owner's Mac switched off.
#
#   brief    tools/ci/prompt.mjs fills ci/prompt.md, right after checkout and node (before any install). Its
#            pre-gate (no model) turns plain spam down first: a topic or feedback with a link, the same letter or
#            word over and over, mostly another alphabet, or only invisible characters writes
#            out/ci/rejected.json and ends the run here, so nothing is installed and Claude is never started
#   plan     (films, plan step 2.3) tools/ci/director.mjs: three pitches and a fresh-context judge on the API key, the pick
#            appended to the brief; on any problem nothing, and the brief goes on alone
#   script   Claude Code (plan step 2.1: on the API key through tools/ci/claude-run.mjs, "claude api"; on the owner's Claude
#            token through the Claude Code Action, "claude oauth", when the API hands over or STUDIO_ENGINE=oauth; the
#            short step named "script" is the verdict the site reads) first judges the request (ci/prompt.md §0, the
#            gate): not about cars or the app, not fit to post, or orders to Claude, and it runs "prompt.mjs --reject off_topic" and stops;
#            the "gate" step then fails the run before any voice is spent. Otherwise it writes specs/<id>.json
#            (film, cover, post text), the film's own new visual (src/scenes/film/<Name>.tsx, a Film scene) and
#            its ledger line
#   voice    tools/vo.py: Gemini TTS on the free key, the whole film in one request; when every Gemini model
#            is out of today's free quota, Microsoft's edge-tts reads it (a film always comes out) and
#            out/ci/voice-quota.json says so ("fallback": "edge"; post.json "geminiOut", the site warns
#            before the next film). Repo variable STUDIO_NO_EDGE=1 stops the run instead ("voice_quota").
#            Every request is cached in tools/.vo_cache, and that cache travels from run to run (actions/cache)
#   render   make.sh, the same chain as on the Mac: CRF 16 -tune film, the glitch check, -10 LUFS
#   cover    tools/covers.mjs
#   publish  the three files (and a small thumb.jpg of the cover) are uploaded as single-file artifacts (2 days),
#            the spec and the ledgers are committed back to the branch, and a short job summary is written
#
# The Story slides (input mode "slides", the owner 2026-10-19: a STORIES section on the page for PHOTOS): the same steps by the
# same names, each doing the slides' part: brief ci/slides.md, the Claude step writes specs/slides/<id>.json (tools/ci/slides.mjs
# lints it, tools/slides.mjs checks its stills), no voice (the step passes), render the full-size slides and the Highlight
# cover (tools/slides.mjs render), package slide-1.png .. slide-7.png, highlight.png, post.json ("kind": "slides") and
# thumb.jpg, publish the set and specs/.slides.json. A set has its own daily cap, the films' number, counted apart
# (the owner 2026-10-23: 10 films and 10 story sets a day; until then one count for both).
# The site's API finds a run by its title ("studio <req> ..."), reads progress from the six step names
# below (setup, script, voice, render, cover, publish: keep them exactly), and fetches the artifacts
# video.mp4, cover.png and post.json (and thumb.jpg, a small cover for the site's grid, when it could be
# made); a failed run leaves error.json ({"code": "off_topic", "reason": ..., "field": "topic" | "feedback"}
# when the gate or the pre-gate turned the request down, {"code": "voice_quota"} when today's Gemini voice is
# gone and STUDIO_NO_EDGE forbade edge-tts, {"code": "daily_cap"} when "check request" found today's cap already started,
# {"code": "claude_auth"} / {"code": "claude_limit"} when the Claude token is refused or its usage limit is
# reached (claude_limit adds "until", ISO UTC, and "window", "session" or "week", when Claude named them),
# else {"code": "failed", "step": ...}).
# The inputs never reach a shell directly: they travel in env only. The typed topic and feedback are not in
# the job's env (every step's log header prints it, and the logs of a public repo are public): "check
# request" reads them from the event, masks them and hands them on through GITHUB_ENV.
name: studio
run-name: "studio ${{ inputs.req }} ${{ inputs.meta }}"

on:
  workflow_dispatch:
    inputs:
      req:
        description: "Request id from the site (r-xxxxxx-xxxx)"
        required: true
        type: string
      topic:
        description: "What the video is about, up to 5000 characters: a detailed idea is the film's plan (empty: pick an idea not covered yet; not about cars or the app: turned down)"
        required: false
        type: string
        default: ""
      category:
        description: "An id from ci/categories.json (empty: the topic decides; with no topic, the dice). One still waiting for its App Store release (\"release\") or a retired one is refused at the brief"
        required: false
        type: string
        default: ""
      length:
        description: "Seconds (a new car-knowledge film asked under 45 is made at 60: its lesson, ci/categories.json)"
        required: false
        type: choice
        options: ["15", "20", "30", "45", "60"]
        default: "20"
      voice:
        description: "m = gemini:Algieba, f = gemini:Achernar"
        required: false
        type: choice
        options: ["m", "f"]
        default: "m"
      mood:
        description: "calm, normal or wild"
        required: false
        type: choice
        options: ["calm", "normal", "wild"]
        default: "normal"
      feedback:
        description: "Redo: what to change (up to 1000 characters)"
        required: false
        type: string
        default: ""
      base:
        description: "Redo: the req of the earlier video"
        required: false
        type: string
        default: ""
      meta:
        description: "The site's own note (JSON, shown in the run title only; the site encrypts the topic in it)"
        required: false
        type: string
        default: ""
      mode:
        description: "film (the default) or slides (Instagram Story slides: PHOTOS, 3 to 7, and a Highlight cover; tools/ci/slides.mjs)"
        required: false
        type: choice
        options: ["film", "slides"]
        default: "film"

permissions:
  contents: write # the commit-back of the spec and the ledgers
  actions: read

# one film at a time, and never cancel one half-way. queue: max lets several requests wait in line
# (first in, first out); the default keeps only one waiting run and cancels it when a third arrives.
concurrency:
  group: studio
  cancel-in-progress: false
  queue: max

jobs:
  studio:
    name: studio
    # pinned, not ubuntu-latest: that label moves to Ubuntu 26.04 from 2026-10-19, and the render stack
    # (Chrome's libraries, SwiftShader, the glitch check) is only proven on 24.04. Move on purpose, after a test.
    runs-on: ubuntu-24.04
    # software GL on a 2..4-core runner: the render alone may take 20..45 min (tools/platform.mjs), a 30 s
    # film about 1.5 times that, a 45 s film (2026-10-02) about 2.2 times (whole runs took 15..26 min in Oct 2026). Measured
    # render steps, 2026-10-01..11 (the motion layer and the illustrated scenes since 10-06): 15 s 14..24 min, 20 s 26..34,
    # 30 s 16..45, 45 s 28..49; so a 60 s lesson (2026-10-12) needs about 75..95, the subtitle probe (at most 10) included:
    # the render step's limit went from 110 to 140 minutes for it (the glitch re-render one at a time no longer runs in the
    # cloud: VS_RERENDER_MAX keeps it to a film whose first render times the concurrency fits 600 s, make.sh). The script
    # step may take 50 (it also designs
    # and refines the film's own Film scene). A time-out loses the whole film; a success costs the same either
    # way (standard runners are free in a public repo).
    # The budget: script 50 + render 140 + about 15 for the rest (setup, voice, cover, publish) = 205 until plan step 2.1
    # (2026-10-26), now 220: + 10 for the API engine's hand-over window (tools/ci/claude-run.mjs FALLBACK_MIN: a refused
    # key or no credits come on the first requests, then the Claude token gets its own 50) + 5 for "plan" (the director).
    # The script and render steps have their own limits inside it, so an overrun there is an ordinary failed step and
    # "failure note" still runs. Keep JOB_TIMEOUT_MS in web/api/studio.js (the Vinari repo), the page's JOB_MIN and the
    # mock equal to this (scripts/studio-lock-words-test.mjs).
    timeout-minutes: 220
    env:
      STUDIO_REQ: ${{ inputs.req }}
      # STUDIO_TOPIC and STUDIO_FEEDBACK come from "check request" (masked, through GITHUB_ENV)
      STUDIO_CATEGORY: ${{ inputs.category }}
      STUDIO_LENGTH: ${{ inputs.length }}
      STUDIO_VOICE: ${{ inputs.voice }}
      STUDIO_MOOD: ${{ inputs.mood }}
      STUDIO_BASE: ${{ inputs.base }}
      # film or slides (a dispatch from before the input existed has none: a film); "slide" is a Story set of ONE image
      # (the owner, 2026-10-19): it runs as "slides" with STUDIO_ONE=1 (tools/ci/prompt.mjs, tools/ci/slides.mjs)
      STUDIO_MODE: ${{ (inputs.mode == 'slide' && 'slides') || inputs.mode || 'film' }}
      STUDIO_ONE: ${{ inputs.mode == 'slide' && '1' || '' }}
      # make.sh: the film only (the cover and the upload are their own steps)
      VS_CI: "1"
      # three.js without a GPU: ANGLE on SwiftShader (tools/platform.mjs). Repo variable STUDIO_GL overrides
      # (angle-egl: Mesa's llvmpipe, an untested speed experiment; setup installs Mesa for it).
      VS_GL: ${{ vars.STUDIO_GL || 'swangle' }}
      # Chrome tabs per render; empty = the runner's cores minus one, at least 2 (tools/platform.mjs)
      VS_CONCURRENCY: ${{ vars.STUDIO_CONCURRENCY }}
      # Remotion adds --disable-gpu-rasterization under this flag, its fix for stale horizontal strips in
      # software-GL renders (remotion-dev/remotion#11428, seen on Lambda, the same SwANGLE stack as here).
      # Its only other effect is the wording of an out-of-memory error.
      __RESERVED_IS_INSIDE_REMOTION_LAMBDA: "true"
      # Off by default (the owner, 2026-09-25: a video must always come out): when every Gemini model is out of
      # today's free quota, tools/vo.py reads the film with Microsoft's edge-tts and the site labels it. Repo
      # variable STUDIO_NO_EDGE=1 switches the fallback off: vo.py then stops (exit 75, out/ci/voice-quota.json
      # without "fallback") and the run fails as "voice_quota".
      VO_NO_EDGE: ${{ vars.STUDIO_NO_EDGE || '' }}
    steps:
      - name: check request
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_ENGINE: ${{ vars.STUDIO_ENGINE }}
          # the hard limit against spam (the owner, 2026-09-25: at most 10 a day; the site shows it top right as
          # "დღეს N / 10"). Since 2026-10-23 for each kind apart: 10 films and 10 story sets a day. Keep equal to
          # the site's STUDIO_DAILY_CAP (Vercel env, default 10)
          STUDIO_DAILY_CAP: ${{ vars.STUDIO_DAILY_CAP || '10' }}
          # The day's count starts again from this moment (UTC, the owner, 2026-10-12: "the tests filled it, set it to 0 and
          # restart the count today"): runs created before it no longer count. Keep equal to the site's STUDIO_COUNT_FROM
          # (Vercel env). Only a moment inside the run's own Tbilisi day changes anything.
          STUDIO_COUNT_FROM: ${{ vars.STUDIO_COUNT_FROM || '2026-10-12T10:35:00Z' }}
        run: |
          export LC_ALL=C.UTF-8
          re='^r-[0-9a-z]{6,12}-[0-9a-z]{4,8}$'
          bad() { echo "::error::$1"; exit 1; }
          # The typed text comes from the event, never from the job's env (every step's log header prints that,
          # and the logs of this public repo are public). Masked from here on: the brief in the script step's
          # header, and any later line, show *** instead. "%" is escaped the way workflow commands read it.
          topic=$(jq -r '.inputs.topic // ""' "$GITHUB_EVENT_PATH")
          feedback=$(jq -r '.inputs.feedback // ""' "$GITHUB_EVENT_PATH")
          meta=$(jq -r '.inputs.meta // ""' "$GITHUB_EVENT_PATH")
          for v in "$topic" "$feedback"; do
            while IFS= read -r l; do if [[ -n "${l//[[:space:]]/}" ]]; then echo "::add-mask::${l//%/%25}"; fi; done <<< "$v"
          done
          [[ "$STUDIO_REQ" =~ $re ]] || bad "req is not a request id (r-xxxxxx-xxxx)"
          [[ -z "$STUDIO_BASE" || "$STUDIO_BASE" =~ $re ]] || bad "base is not a request id"
          # The site's limits (web/api/studio.js line(), tools/ci/prompt.mjs TOPIC_MAX / FEEDBACK_MAX): an idea up to
          # about a page, a redo's note up to 1000. Characters, not bytes (LC_ALL above).
          (( ${#topic} <= 5000 )) || bad "topic is longer than 5000 characters"
          # the id itself is checked against ci/categories.json by the brief (tools/ci/prompt.mjs)
          [[ -z "$STUDIO_CATEGORY" || "$STUDIO_CATEGORY" =~ ^[a-z]{2,16}$ ]] || bad "category is not a category id"
          (( ${#feedback} <= 1000 )) || bad "feedback is longer than 1000 characters"
          (( ${#meta} <= 400 )) || bad "meta is longer than 400 characters"
          case "$STUDIO_LENGTH" in 15|20|30|45|60) ;; *) bad "length must be 15, 20, 30, 45 or 60" ;; esac
          case "$STUDIO_VOICE" in m|f) ;; *) bad "voice must be m or f" ;; esac
          case "$STUDIO_MOOD" in calm|normal|wild) ;; *) bad "mood must be calm, normal or wild" ;; esac
          case "$STUDIO_MODE" in film|slides) ;; *) bad "mode must be film or slides" ;; esac
          [[ "$STUDIO_MODE" != slides || ( -z "$STUDIO_BASE" && -z "$feedback" ) ]] || bad "a Story set is never a redo"

          # A re-run ("Re-run jobs" on GitHub) repeats a request the cap already counted: once, on its own day.
          (( ${GITHUB_RUN_ATTEMPT:-1} <= 2 )) || bad "this request was already re-run once"
          api="repos/$GITHUB_REPOSITORY/actions"
          # The same request twice (a phone that retried after a lost answer, on another Vercel instance): only
          # the first run makes the film. The site shows the first one; this one stops before anything is spent.
          if dup=$(gh api "$api/workflows/studio.yml/runs?per_page=50&event=workflow_dispatch" |
               jq -r --arg r "studio $STUDIO_REQ" --argjson me "$GITHUB_RUN_ID" \
                 '[.workflow_runs[] | select(.id < $me and (.display_title == $r or (.display_title | startswith($r + " "))))] | length'); then
            [[ "$dup" == 0 || ! "$dup" =~ ^[0-9]+$ ]] || bad "request $STUDIO_REQ was already started by an earlier run"
          else
            echo "::warning::could not look for an earlier run of the same request"
          fi
          # The daily cap, counted here too. The site counts from GitHub's run list (a few seconds late) and
          # from each Vercel instance's own memory, so two taps landing on two instances could both pass it.
          # GitHub does the counting: every dispatched run of this workflow created on this run's Tbilisi day
          # (UTC+4 all year) before this one (a lower run id), finished, failed or still waiting, of this run's
          # kind (the owner, 2026-10-23: films and story sets each have the cap): a story set when its title's
          # meta says "k": "s", a film otherwise, whatever its name (web/api/studio.js parseTitle reads it the
          # same way). Every page of the day's list (--paginate, created=from..this run), so a pile of later
          # or junk dispatches cannot hide the earlier ones. event=workflow_dispatch: a fork's pull request that edits this file into a
          # pull_request workflow creates runs under the same path (unapproved, "action_required"), and they
          # must never fill the day. A request the gate turns down counts (it was started). Same range and
          # fallback as the site (1..20, else 10). A count that cannot be made stops the run (after three
          # tries): going past the cap is the one thing this step is for.
          [[ "$STUDIO_DAILY_CAP" =~ ^[0-9]+$ ]] && (( STUDIO_DAILY_CAP >= 1 && STUDIO_DAILY_CAP <= 20 )) || STUDIO_DAILY_CAP=10
          count() {
            local made from day today kinds total
            made=$(gh api "$api/runs/$GITHUB_RUN_ID" --jq .created_at) && [[ -n "$made" ]] || return 1
            read -r from day today < <(jq -rn --arg t "$made" '($t | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601 + 14400) as $s
              | [($s - $s % 86400 - 14400 | todate), ($s | strftime("%Y-%m-%d")), (now + 14400 | strftime("%Y-%m-%d"))] | join(" ")') || return 1
            # a count restarted today (STUDIO_COUNT_FROM): from that moment on, never before the day began
            [[ "$STUDIO_COUNT_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ && "$STUDIO_COUNT_FROM" > "$from" && "$STUDIO_COUNT_FROM" < "$made" ]] && from=$STUDIO_COUNT_FROM
            kinds=$(gh api --paginate "$api/workflows/studio.yml/runs?per_page=100&event=workflow_dispatch&created=$from..$made" \
              --jq ".workflow_runs[] | select(.id < $GITHUB_RUN_ID) | .display_title | sub(\"^studio [^ ]* ?\"; \"\") | (try fromjson catch null)
                | if type == \"object\" and .k == \"s\" then \"slides\" else \"film\" end") || return 1
            total=$(grep -cx -- "$STUDIO_MODE" <<< "$kinds" || true)
            [[ "$total" =~ ^[0-9]+$ && "$day" =~ ^[0-9-]+$ && "$today" =~ ^[0-9-]+$ ]] || return 1
            echo "$total $day $today"
          }
          got=""
          for try in 1 2 3; do got=$(count) && break; got=""; sleep $(( try * 5 )); done
          [[ -n "$got" ]] || bad "could not count today's runs on GitHub (3 tries); stopping rather than risk going past the cap"
          read -r total day today <<< "$got"
          earlier=$total
          echo "$STUDIO_MODE started before this one today: $earlier of $STUDIO_DAILY_CAP"
          if (( earlier >= STUDIO_DAILY_CAP )); then
            echo '{"code":"daily_cap"}' > "$RUNNER_TEMP/cap.json"
            bad "today's $STUDIO_DAILY_CAP $([[ $STUDIO_MODE == slides ]] && echo 'story sets' || echo videos) were already started before this request"
          fi
          (( ${GITHUB_RUN_ATTEMPT:-1} == 1 )) || [[ "$day" == "$today" ]] || bad "a re-run only works on the day of the request"
          # the typed text for the later steps (masked above); a random delimiter, so no value can end it early
          eof="IN_$(openssl rand -hex 16)"
          { echo "STUDIO_TOPIC<<$eof"; printf '%s\n' "$topic"; echo "$eof"
            echo "STUDIO_FEEDBACK<<$eof"; printf '%s\n' "$feedback"; echo "$eof"; } >> "$GITHUB_ENV"
          echo "request $STUDIO_REQ ($STUDIO_MODE): ${STUDIO_LENGTH} s, voice $STUDIO_VOICE, mood $STUDIO_MOOD, category ${STUDIO_CATEGORY:-none}${STUDIO_BASE:+, redo of $STUDIO_BASE}${topic:+, a typed topic}${feedback:+, feedback}"
          # The script step's engine (plan step 2.1): "api" (the API key first, the Claude token when it hands over), or
          # "oauth" (the token only: repo variable STUDIO_ENGINE=oauth). A TEST run may ask in its meta for {"engine":
          # "oauth"} or {"engine": "badkey"} (a wrong API key on purpose: the API engine must hand over within a minute and
          # the token make the film); only who may dispatch this workflow (the site, the owner) writes meta.
          engine=api
          [[ "${STUDIO_ENGINE,,}" == oauth ]] && engine=oauth
          want=$(jq -r '.inputs.meta // "" | (try fromjson catch null) | if type == "object" then (.engine // "" | tostring) else "" end' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          case "$want" in oauth|badkey) engine=$want; echo "a test run: engine $engine" ;; esac
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "script engine: $engine"

      # ref: the branch, not the commit it pointed at when this run was dispatched. A run that waited in the
      # queue behind another one must see that run's committed spec and ledgers, or it reuses the video
      # number, the look and possibly the id (publish would then overwrite the earlier film's spec).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          # the engine's packages (tools/ci/engine) ride in the same npm cache
          cache-dependency-path: |
            package-lock.json
            tools/ci/engine/package-lock.json

      # Before setup-python, the caches and "setup": prompt.mjs needs only node and the repo's own files, so a
      # request the pre-gate turns down ends before anything is installed and frees the queue at once.
      - name: brief
        id: brief
        shell: bash
        run: |
          # exit 4: the pre-gate turned plain spam down (a link, the same letter or word over and over, mostly
          # another alphabet, only invisible characters), wrote out/ci/rejected.json and printed no brief. The run
          # ends here, Claude is never started, and "failure note" writes error.json "off_topic".
          rc=0
          prompt=$(node tools/ci/prompt.mjs) || rc=$?
          if [[ -f out/ci/rejected.json ]]; then
            echo "::error::OFF_TOPIC: $(jq -r '"the pre-gate turned the \(.field // "request") down (\(.rule // "spam"))"' out/ci/rejected.json 2>/dev/null)"
            exit 1
          fi
          (( rc == 0 )) || exit "$rc"
          [[ -n "$prompt" ]] || { echo "::error::tools/ci/prompt.mjs printed no prompt"; exit 1; }
          eof="BRIEF_$(openssl rand -hex 16)"
          { echo "text<<$eof"; printf '%s\n' "$prompt"; echo "$eof"; } >> "$GITHUB_OUTPUT"
          # the director and the API engine read it from a file (never through env: a step's env is printed in its log)
          printf '%s\n' "$prompt" > "$RUNNER_TEMP/brief.md"
          echo "prompt: ${#prompt} characters"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: restore browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/remotion-browser
          key: remotion-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: restore voices
        # a Story set has no voice: no cache to restore (minutes saved), and none saved below
        if: env.STUDIO_MODE != 'slides'
        uses: actions/cache/restore@v6
        with:
          path: tools/.vo_cache
          key: vo-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vo-${{ runner.os }}-

      - name: setup
        id: setup
        shell: bash
        env:
          # the API engine is installed only when it may run: the repo has the key, and the run is not on the token only
          STUDIO_API_ENGINE: ${{ steps.check.outputs.engine != 'oauth' && secrets.ANTHROPIC_API_KEY != '' && '1' || '' }}
        run: bash tools/ci/setup.sh

      # The API credits' ledger (plan step 2.2, tools/ci/spend.mjs): this month's spend, carried from run to run like the
      # voice cache and saved right after the script step ("save spend", even when the run fails: the spend happened).
      - name: restore spend
        uses: actions/cache/restore@v6
        with:
          path: tools/.spend
          key: spend-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            spend-

      # Plan step 2.3 (tools/ci/director.mjs): three pitches and a judge that never saw them written, two Messages API
      # calls on the API key (about $0.3); the pick goes to the end of the brief ("The plan (the director's pick)",
      # $RUNNER_TEMP/plan.md and this step's output). Films only, never a redo or a free idea. It never stops a film:
      # any problem (no key, the credits, an API error, a refusal, a weak pick) leaves the brief alone. Not a contract name.
      - name: plan
        id: plan
        if: env.STUDIO_MODE == 'film' && steps.check.outputs.engine != 'oauth'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ steps.check.outputs.engine == 'badkey' && 'sk-ant-api03-studio-test-wrong-key-on-purpose' || secrets.ANTHROPIC_API_KEY }}
          STUDIO_API_MONTH_USD: ${{ vars.STUDIO_API_MONTH_USD || '190' }}
          STUDIO_API_CYCLE_DAY: ${{ vars.STUDIO_API_CYCLE_DAY || '2' }}
          STUDIO_DIRECTOR: ${{ vars.STUDIO_DIRECTOR }}
        run: node tools/ci/director.mjs plan

      # The script step, plan step 2.1 (2026-10-26): the same Claude Code on two engines, one list of tools (ci/tools.json).
      #   claude api    tools/ci/claude-run.mjs on the repo secret ANTHROPIC_API_KEY (the Max plan's monthly API credits,
      #                 no card: an empty balance is the hard cap), paced by tools/ci/spend.mjs. It hands over (output
      #                 fallback=1) when there is no key, the engine did not install, the credits say no, or the API
      #                 refuses within its first 10 minutes (a wrong or revoked key, no credits, a rate limit, an outage).
      #                 It prints a cleaned result line only, never the transcript (the logs of this repo are public).
      #   clean for fallback, claude token, claude oauth: only after a hand-over or with STUDIO_ENGINE=oauth, the Claude
      #                 Code Action on the owner's Claude token, as before (so an expired token no longer stops a film the
      #                 API can make).
      #   script        the verdict: the step the site reads (web/api/studio.js STEPS) and "failure note" names; out/ci/engine
      #                 says which engine wrote it (post.json "engine", the job summary).
      # Claude Code scrubs the API key and the token out of its Bash commands' env on GitHub Actions by default
      # (GITHUB_ACTIONS=true; GEMINI_API_KEY is not on its list, so check.mjs still voices through vo.py), and the tool
      # lists deny reading /proc and .git. CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 is not set: it would also force a subprocess
      # sandbox that the render stack (Chrome on SwiftShader, check.mjs's stills) has never run in.
      - name: claude api
        id: api
        if: steps.check.outputs.engine != 'oauth'
        continue-on-error: true
        # 50: the spec, its checks and the film's own Film scenes (written, linted, looked at on the sheet, refined)
        timeout-minutes: 50
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ steps.check.outputs.engine == 'badkey' && 'sk-ant-api03-studio-test-wrong-key-on-purpose' || secrets.ANTHROPIC_API_KEY }}
          # tools/check.mjs voices the draft through tools/vo.py
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STUDIO_MODEL: ${{ vars.STUDIO_MODEL || 'claude-opus-5-5' }}
          # unset: Claude Code's own default, as on the token
          STUDIO_EFFORT: ${{ vars.STUDIO_EFFORT }}
          STUDIO_API_MONTH_USD: ${{ vars.STUDIO_API_MONTH_USD || '190' }}
          STUDIO_API_CYCLE_DAY: ${{ vars.STUDIO_API_CYCLE_DAY || '2' }}
          STUDIO_API_FILM_MAX: ${{ vars.STUDIO_API_FILM_MAX || '12' }}
          # tools/check.mjs (voice, bundle, stills in software GL) can outlast Claude Code's 2-minute
          # Bash default: let it finish in the foreground instead of timing out or going to background
          BASH_DEFAULT_TIMEOUT_MS: "900000"
          BASH_MAX_TIMEOUT_MS: "1200000"
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        run: node tools/ci/claude-run.mjs write

      # whatever the API run left (a spec, a Film file, a ledger line, a refusal note) goes, so the token starts clean
      - name: clean for fallback
        if: steps.api.outputs.fallback == '1'
        shell: bash
        run: |
          git checkout -- specs src/scenes/film
          git clean -fdq -- specs src/scenes/film
          rm -f out/ci/rejected.json
          echo "the API handed over: the Claude token makes this film"

      - name: claude token
        # A token copied out of a terminal can carry the terminal's line wrap. Clean it, and say (never the value)
        # whether it looks right, so a bad paste is a one-line diagnosis instead of a silent 150 ms failure.
        # Handed to the OAuth step as this step's output, never through GITHUB_ENV: that would put the owner's
        # Claude token in the env of every later step (voice, render with its npm packages and Chrome, cover,
        # publish, the upload actions and every post step), none of which needs it. Also the step's claude_args, from
        # ci/tools.json (the API engine reads the same file).
        id: claude_token
        if: steps.check.outputs.engine == 'oauth' || steps.api.outputs.fallback == '1'
        shell: bash
        env:
          RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STUDIO_MODEL: ${{ vars.STUDIO_MODEL || 'claude-opus-5-5' }}
        run: |
          tok=$(printf '%s' "$RAW" | tr -d '\r\n\t ')
          lines=$(printf '%s' "$RAW" | grep -c '' || true)
          prefix=no; [[ $tok == sk-ant-oat* ]] && prefix=yes
          echo "claude token: ${#RAW} chars as stored, ${#tok} after cleaning, ${lines} line(s), starts like an OAuth token: ${prefix}"
          [[ -n "$tok" ]] || { echo "::error::the secret CLAUDE_CODE_OAUTH_TOKEN is empty"; exit 1; }
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"
          args=$(node tools/ci/claude-run.mjs args)
          eof="ARGS_$(openssl rand -hex 16)"
          { echo "args<<$eof"; printf '%s\n' "$args"; echo "$eof"; } >> "$GITHUB_OUTPUT"

      - name: claude oauth
        id: oauth
        if: steps.check.outputs.engine == 'oauth' || steps.api.outputs.fallback == '1'
        # the verdict ("script") decides; this step's own failure only feeds it
        continue-on-error: true
        # pinned: this third-party action gets the Claude token, the Gemini key and a write token.
        # To update: git ls-remote https://github.com/anthropics/claude-code-action refs/tags/v1^{}
        # (and tools/ci/engine's @anthropic-ai/claude-agent-sdk to the version its base-action/bun.lock pins)
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        timeout-minutes: 50
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASH_DEFAULT_TIMEOUT_MS: "900000"
          BASH_MAX_TIMEOUT_MS: "1200000"
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          prompt: ${{ steps.plan.outputs.text || steps.brief.outputs.text }}
          claude_code_oauth_token: ${{ steps.claude_token.outputs.token }}
          # the workflow's own token: no GitHub App and no id-token exchange needed
          github_token: ${{ github.token }}
          # the model, the turn cap (140) and the tool lists of ci/tools.json ("claude token" builds them). The
          # film's own Film scenes (one to three since plan step 1.3): Claude may also write src/scenes/film/** (one-off
          # drawing code; never the template or another "_" file). They run only in the render page (the Remotion bundle),
          # never in Node, and tools/ci/filmlint.mjs (run by build-index and check) refuses anything but drawing code;
          # check.mjs also refuses a change to any other file there, and publish commits only the film's own files.
          claude_args: ${{ steps.claude_token.outputs.args }}

      # The contract step "script": done when either engine finished. Runs after a failure too (not after a cancel), so
      # the site's progress and "failure note" name the script step as before.
      - name: script
        id: script
        if: (success() || failure()) && steps.setup.outcome == 'success'
        shell: bash
        env:
          ENGINE: ${{ steps.check.outputs.engine }}
          API_DONE: ${{ steps.api.outputs.done }}
          API_USD: ${{ steps.api.outputs.usd }}
          FALLBACK: ${{ steps.api.outputs.fallback }}
          OAUTH: ${{ steps.oauth.outcome }}
        run: |
          mkdir -p out/ci
          if [[ $API_DONE == 1 ]]; then
            echo api > out/ci/engine
            echo "the script was written on the API key (\$${API_USD:-?})"
            exit 0
          fi
          if [[ $ENGINE == oauth || $FALLBACK == 1 ]]; then echo oauth > out/ci/engine; else echo api > out/ci/engine; fi
          if [[ $OAUTH == success ]]; then
            echo "the script was written on the Claude token${FALLBACK:+ (the API handed over)}"
            exit 0
          fi
          echo "::error::no engine finished the script ($(cat out/ci/engine))"
          exit 1

      - name: save spend
        if: always() && hashFiles('tools/.spend/ledger.json') != ''
        uses: actions/cache/save@v6
        with:
          path: tools/.spend
          key: spend-${{ github.run_id }}-${{ github.run_attempt }}

      - name: spend
        # one line in the job summary: "api $x.xx · month $y / 190 · engine api|oauth"
        if: always() && steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          STUDIO_API_MONTH_USD: ${{ vars.STUDIO_API_MONTH_USD || '190' }}
          STUDIO_API_CYCLE_DAY: ${{ vars.STUDIO_API_CYCLE_DAY || '2' }}
        run: node tools/ci/spend.mjs summary

      - name: claude error
        # The action hides Claude's output (the logs of a public repo are public). On a failure print only the
        # final result line (an API or auth error reads like "Invalid bearer token"), never the transcript.
        # Two failures are the owner's to fix, not a retry's, and the site names them: the token refused
        # (expired about a year after "claude setup-token", or revoked) -> "claude_auth", and the Claude Max
        # usage limit reached (shared with the owner's own Claude; extra usage is off, so it blocks until the
        # reset instead of billing) -> "claude_limit". "failure note" copies the code into error.json.
        # claude_limit also says when the limit comes back and which one, if the line names them: "until" (ISO,
        # UTC) and "window" ("session", the 5-hour window, or "week"); never the text itself. Claude Code says it
        # like "You've hit your limit · resets 9pm (UTC)", "You've hit your weekly limit · resets Oct 25, 9pm
        # (UTC)" (2026-10-24: the old patterns missed it, and the site said only "it did not work") or, older,
        # "Claude AI usage limit reached|1761426000". The patterns and the time reading are web/api/studio.js's
        # (CLAUDE_LIMIT_RE, claudeResetAt): change both together.
        # The API engine's failures are not the owner's token or his Max limit: "claude api" printed its own line
        # ("api result: ..."), and no note is written here, so the site shows an ordinary failure of the script step.
        if: failure()
        shell: bash
        run: |
          if [[ "$(cat out/ci/engine 2>/dev/null)" == api ]]; then echo "the API engine failed: see its \"api result\" line above"; exit 0; fi
          f="$RUNNER_TEMP/claude-execution-output.json"
          [[ -f $f ]] || { echo "no Claude output file"; exit 0; }
          python3 - "$f" "$RUNNER_TEMP/claude-error.json" <<'PY'
          import json, re, sys
          from datetime import datetime, timedelta, timezone
          try:
              from zoneinfo import ZoneInfo
          except ImportError:
              ZoneInfo = None
          AUTH = r"oauth token (has )?expired|invalid (api key|bearer|x-api-key)|authenticat|unauthori[sz]ed|\b401\b|please run /login|token (was )?revoked"
          LIMIT = (r"(you['’]ve|you have) (hit|reached) your (\w+ )?limit|usage limit|limit reached|\b(5-hour|session|weekly|opus|sonnet) limit"
                   r"|rate.?limit|\b429\b|\blimit\b[^.\n]{0,40}\bresets?\b|resets? (at|in) ")
          MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"]

          def zone(name):
              name = (name or "").strip()
              if not name or ZoneInfo is None or re.fullmatch(r"utc|gmt|z|etc/(utc|gmt)", name, re.I):
                  return timezone.utc
              try:
                  return ZoneInfo(name)
              except Exception:
                  return timezone.utc

          # when the limit comes back, or None; the clock times are in the zone the brackets name (the runner's, UTC)
          def reset_at(text, now):
              m = re.search(r"\|\s*(\d{10})\b", text)
              if m:
                  return datetime.fromtimestamp(int(m.group(1)), timezone.utc)
              m = re.search(r"\bresets?\s+in\s+(\d{1,3})\s*h(?:ours?|rs?)?(?:\s*(\d{1,2})\s*m)?", text, re.I)
              if m:
                  return now + timedelta(hours=int(m.group(1)), minutes=int(m.group(2) or 0))
              m = re.search(r"\bresets?\s+(?:at\s+|on\s+)?(?:([a-z]{3})[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(?:at\s+)?)?"
                            r"(\d{1,2})(?::(\d{2}))?\s*([ap]\.?m\.?)?\s*(?:\(([^)]{1,40})\))?", text, re.I)
              if not m:
                  return None
              hour, minute = int(m.group(3)), int(m.group(4) or 0)
              half = (m.group(5) or "").lower().replace(".", "")
              if half:
                  if not 1 <= hour <= 12:
                      return None
                  hour = hour % 12 + (12 if half == "pm" else 0)
              if hour > 23 or minute > 59:
                  return None
              tz = zone(m.group(6))
              local = now.astimezone(tz)
              try:
                  if m.group(1):
                      at = datetime(local.year, MONTHS.index(m.group(1).lower()) + 1, int(m.group(2)), hour, minute, tzinfo=tz)
                      # "Jan 2" read on 30 December is next year's
                      return at if at >= now - timedelta(days=2) else at.replace(year=local.year + 1)
                  at = datetime(local.year, local.month, local.day, hour, minute, tzinfo=tz)
                  # the next time the clock shows it
                  return at if at > now - timedelta(minutes=1) else at + timedelta(days=1)
              except ValueError:
                  return None

          try:
              data = json.load(open(sys.argv[1]))
          except Exception as e:
              print("output file unreadable:", e); sys.exit(0)
          items = data if isinstance(data, list) else [data]
          for it in reversed(items):
              if isinstance(it, dict) and it.get("type") == "result":
                  text = str(it.get("result") or it.get("error") or it.get("subtype"))
                  print("claude result:", text[:300])
                  note = None
                  if re.search(AUTH, text, re.I):
                      note = {"code": "claude_auth"}
                  elif re.search(LIMIT, text, re.I):
                      note = {"code": "claude_limit"}
                      now = datetime.now(timezone.utc)
                      at = reset_at(text[:400], now)
                      # a time worth showing: after now (a minute of slack) and within the week the longest window lasts
                      if at and now - timedelta(minutes=1) < at < now + timedelta(days=8):
                          note["until"] = at.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                      window = "week" if re.search(r"week", text, re.I) else "session" if re.search(r"session|5-hour|five.hour", text, re.I) else None
                      if window:
                          note["window"] = window
                  if note:
                      json.dump(note, open(sys.argv[2], "w"))
                      print("error note:", json.dumps(note))
                  break
          PY

      # The gate (ci/prompt.md §0): Claude turned the request down (not about cars or the app, not fit to post, or
      # orders to Claude) with "node tools/ci/prompt.mjs --reject off_topic", which wrote out/ci/rejected.json.
      # Stop here, before any voice, render or upload; "failure note" writes error.json "off_topic". A last line
      # with the word OFF_TOPIC in it ("OFF_TOPIC.", "**OFF_TOPIC**") without that file (the command did not
      # land) is a rejection too, with the default reason, and so is a typed request that Claude ended without
      # touching specs/ (a refusal in its own words): never a "failed" that the site offers to retry, which
      # would spend another run on the same topic. A rejection always wins, even over a spec written after it.
      # Then the spec itself: resolve.mjs checks it is this request's (a new id, or the redo's), so a missing or
      # broken one fails here and error.json names the script step, not the voice; and ending.mjs --gate refuses a
      # follow reminder in the post, the cover or another beat (a call to action) before any voice. Not a contract name.
      - name: gate
        id: gate
        shell: bash
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          if [[ ! -f out/ci/rejected.json && -f $f ]]; then
            last=$(jq -r '[(if type == "array" then .[] else . end) | select(type == "object" and .type == "result")]
              | last | .result // "" | tostring' "$f" 2>/dev/null | awk 'NF { l = $0 } END { print l }' | tr -d '`*\r\t ') || last=""
            # a finished line's free-text tail (" · not done: <what>", ci/prompt.md) is Claude's words about his idea,
            # never the verdict: it may name the rule it kept (spaces are gone here, so "notdone:")
            last=${last%%[Nn][Oo][Tt][Dd][Oo][Nn][Ee]:*}
            if [[ $last =~ (^|[^A-Za-z0-9_])OFF_TOPIC([^A-Za-z0-9_]|$) ]]; then node tools/ci/prompt.mjs --reject off_topic; fi
          fi
          quota=""
          if [[ -f out/ci/voice-quota.json && "$(jq -r '.fallback // ""' out/ci/voice-quota.json 2>/dev/null)" != edge ]]; then quota=1; fi
          if [[ ! -f out/ci/rejected.json && -z $quota && ( -n $STUDIO_TOPIC || -n $STUDIO_FEEDBACK ) && -z $(git status --porcelain -- specs) ]]; then
            echo "Claude ended a typed request without writing a spec: a refusal"
            node tools/ci/prompt.mjs --reject off_topic
          fi
          if [[ -f out/ci/rejected.json ]]; then
            reason=$(jq -r '.reason // "" | tostring | gsub("[[:cntrl:]%]"; " ")' out/ci/rejected.json 2>/dev/null || true)
            echo "::error::OFF_TOPIC: the request is not a Vinari video, nothing was made (${reason})"
            exit 1
          fi
          # STUDIO_NO_EDGE on and today's voice gone: the voice step stops the run as "voice_quota"
          if [[ -n $quota ]]; then echo "today's Gemini voice is gone: the voice step stops the run"; exit 0; fi
          # a Story set: this request's set (tools/ci/slides.mjs resolve), no ending
          if [[ "$STUDIO_MODE" == slides ]]; then id=$(node tools/ci/slides.mjs resolve); echo "the request passed the gate: $id (a Story set)"; exit 0; fi
          id=$(node tools/ci/resolve.mjs)
          # the ending again (tools/ci/ending.mjs), after the Claude step's fix rounds: a follow reminder outside the
          # ending stops the run here, before the voice (build-index would stop the render on it); a wrong ending
          # is a warning on the run, and the film still comes out
          node tools/ci/ending.mjs --gate "$id"
          echo "the request passed the gate: $id"

      - name: voice
        id: voice
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # with STUDIO_NO_EDGE on, the script step's check may already have met the empty quota (and the brief
          # told Claude to stop there). A note with "fallback": "edge" only says edge-tts read the draft: go on.
          if [[ -f out/ci/voice-quota.json && "$(jq -r '.fallback // ""' out/ci/voice-quota.json 2>/dev/null)" != edge ]]; then
            echo "::error::VOICE_QUOTA: today's free Gemini voice is used up; it comes back at $(jq -r '.resets // "11:00 Tbilisi"' out/ci/voice-quota.json)"
            exit 1
          fi
          # a Story set has no voice: the step only names the set (the site counts this step as done)
          if [[ "$STUDIO_MODE" == slides ]]; then
            id=$(node tools/ci/slides.mjs resolve)
            echo "STUDIO_ID=$id" >> "$GITHUB_ENV"
            echo "a Story set, no voice: $id"
            exit 0
          fi
          id=$(node tools/ci/resolve.mjs)
          echo "STUDIO_ID=$id" >> "$GITHUB_ENV"
          echo "video: $id"
          python3 tools/vo.py "$id"

      - name: save voices
        # a request the gate turned down voiced nothing, and a Story set voices nothing: no copy of the same cache
        if: always() && env.STUDIO_MODE != 'slides' && hashFiles('out/ci/rejected.json') == ''
        uses: actions/cache/save@v6
        with:
          path: tools/.vo_cache
          key: vo-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      # its own limit, inside the job's 205 minutes (script 50 + render 140 + the rest; 110 until the 60 s lessons,
      # 2026-10-12): an overrun is an ordinary
      # failed step, so "failure note" still runs and names it (a job time-out cancels the job instead)
      - name: render
        id: render
        timeout-minutes: 140
        shell: bash
        run: |
          # a Story set: the full-size slides and the Highlight cover, the safe zone checked on the pixels
          if [[ "$STUDIO_MODE" == slides ]]; then node tools/slides.mjs render "$STUDIO_ID"; else ./make.sh "$STUDIO_ID"; fi

      - name: cover
        id: cover
        shell: bash
        run: |
          if [[ "$STUDIO_MODE" == slides ]]; then echo "a Story set: its Highlight cover was rendered with the slides"; else node tools/covers.mjs "$STUDIO_ID"; fi

      - name: package
        id: package
        shell: bash
        run: node tools/ci/publish.mjs package

      # archive: false names the artifact after the file and ignores "name" for the upload, but
      # overwrite deletes by "name" (upload-artifact v7 src/upload/upload-artifact.ts): without it a
      # re-run of a failed run would find "video.mp4" already there and stop
      - name: upload video.mp4
        if: env.STUDIO_MODE != 'slides'
        uses: actions/upload-artifact@v7
        with:
          name: video.mp4
          path: ${{ steps.package.outputs.dir }}/video.mp4
          archive: false
          retention-days: 2
          if-no-files-found: error
          overwrite: true # a re-run of the same run replaces its files

      - name: upload cover.png
        if: env.STUDIO_MODE != 'slides'
        uses: actions/upload-artifact@v7
        with:
          name: cover.png
          path: ${{ steps.package.outputs.dir }}/cover.png
          archive: false
          retention-days: 2
          if-no-files-found: error
          overwrite: true # a re-run of the same run replaces its files

      # a Story set (mode slides): slide-1.png .. slide-N.png (3 to 7) and highlight.png, each its own artifact like the film's
      # files; the site lists them from post.json "slides"
      - name: upload slide-1.png
        if: env.STUDIO_MODE == 'slides'
        uses: actions/upload-artifact@v7
        with:
          name: slide-1.png
          path: ${{ steps.package.outputs.dir }}/slide-1.png
          archive: false
          retention-days: 2
          if-no-files-found: error
          overwrite: true

      - name: upload slide-2.png
        if: env.STUDIO_MODE == 'slides'
        uses: actions/upload-artifact@v7
        with:
          name: slide-2.png
          path: ${{ steps.package.outputs.dir }}/slide-2.png
          archive: false
          retention-days: 2
          if-no-files-found: error
          overwrite: true

      - name: upload slide-3.png
        if: env.STUDIO_MODE == 'slides'
        uses: actions/upload-artifact@v7
        with:
          name: slide-3.png
          path: ${{ steps.package.outputs.dir }}/slide-3.png
          archive: false
          retention-days: 2
          if-no-files-found: error
          overwrite: true

      - name: upload slide-4.png
        if: env.STUDIO_MODE == 'slides'
        uses: actions/upload-artifact@v7
        with:
          name: slide-4.png
          path: ${{ steps.package.outputs.dir }}/slide-4.png
          archive: false
          retention-days: 2
          if-no-files-found: ignore
          overwrite: true

      - name: upload slide-5.png
        if: env.STUDIO_MODE == 'slides'
        uses: actions/upload-artifact@v7
        with:
          name: slide-5.png
          path: ${{ steps.package.outputs.dir }}/slide-5.png
          archive: false
          retention-days: 2
          if-no-files-found: ignore
          overwrite: true

      - name: upload slide-6.png
        if: env.STUDIO_MODE == 'slides'
        uses: actions/upload-artifact@v7
        with:
          name: slide-6.png
          path: ${{ steps.package.outputs.dir }}/slide-6.png
          archive: false
          retention-days: 2
          if-no-files-found: ignore
          overwrite: true

      - name: upload slide-7.png
        if: env.STUDIO_MODE == 'slides'
        uses: actions/upload-artifact@v7
        with:
          name: slide-7.png
          path: ${{ steps.package.outputs.dir }}/slide-7.png
          archive: false
          retention-days: 2
          if-no-files-found: ignore
          overwrite: true

      - name: upload highlight.png
        if: env.STUDIO_MODE == 'slides'
        uses: actions/upload-artifact@v7
        with:
          name: highlight.png
          path: ${{ steps.package.outputs.dir }}/highlight.png
          archive: false
          retention-days: 2
          if-no-files-found: error
          overwrite: true

      - name: upload post.json
        uses: actions/upload-artifact@v7
        with:
          name: post.json
          path: ${{ steps.package.outputs.dir }}/post.json
          archive: false
          retention-days: 2
          if-no-files-found: error
          overwrite: true # a re-run of the same run replaces its files

      # the cover small (360 px wide JPEG, tens of KB instead of 1-2 MB), for the site's grid and live strip;
      # optional: when package could not make it, the site shows cover.png as before
      - name: upload thumb.jpg
        uses: actions/upload-artifact@v7
        with:
          name: thumb.jpg
          path: ${{ steps.package.outputs.dir }}/thumb.jpg
          archive: false
          retention-days: 2
          if-no-files-found: ignore
          overwrite: true # a re-run of the same run replaces its files

      - name: publish
        id: publish
        shell: bash
        run: node tools/ci/publish.mjs publish

      # A failed run says why, for the site (web/api/studio.js reads it like post.json): "off_topic" when the
      # gate or the pre-gate turned the request down (out/ci/rejected.json; its short Georgian "reason" rides
      # along, for the page to show as text only, and "field", "topic" or "feedback", the typed text that was
      # turned down; any other value is dropped), "daily_cap" when "check request" found today's cap already
      # started, "claude_auth" / "claude_limit" when the Claude step's token was refused or its usage limit was
      # reached ("claude error"; claude_limit keeps its checked "until" and "window"), "voice_quota" when today's Gemini voice is gone and STUDIO_NO_EDGE stopped the
      # run (vo.py's out/ci/voice-quota.json without "fallback"), else "failed" and the contract step that broke
      # (the gate counts as script; an edge-tts fallback that failed later is an ordinary failure). It also runs
      # when the job is cancelled (a time-out): then the step that was running is named, or "timeout".
      # Not one of the six contract names: the site counts those.
      - name: failure note
        if: failure() || cancelled()
        shell: bash
        env:
          OUT_SETUP: ${{ steps.setup.outcome }}
          OUT_SCRIPT: ${{ steps.script.outcome }}
          OUT_GATE: ${{ steps.gate.outcome }}
          OUT_VOICE: ${{ steps.voice.outcome }}
          OUT_RENDER: ${{ steps.render.outcome }}
          OUT_COVER: ${{ steps.cover.outcome }}
          OUT_PUBLISH: ${{ steps.publish.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          f="$RUNNER_TEMP/error.json"
          if [[ -f "$RUNNER_TEMP/cap.json" ]]; then
            echo '{"code":"daily_cap"}' > "$f"
          elif [[ -f out/ci/rejected.json ]]; then
            jq -c '{code: "off_topic"} + (.reason | if type == "string" and . != "" then {reason: .[0:200]} else {} end)
              + (.field | if . == "topic" or . == "feedback" then {field: .} else {} end)' \
              out/ci/rejected.json > "$f" 2>/dev/null || echo '{"code":"off_topic"}' > "$f"
          elif [[ -f "$RUNNER_TEMP/claude-error.json" && "$(jq -r '.code // ""' "$RUNNER_TEMP/claude-error.json" 2>/dev/null)" =~ ^claude_(auth|limit)$ ]]; then
            jq -c '{code: .code} + (if .code == "claude_limit" then
                ((.until | if type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$") then {until: .} else {} end)
                + (.window | if . == "session" or . == "week" then {window: .} else {} end)) else {} end)' \
              "$RUNNER_TEMP/claude-error.json" > "$f" 2>/dev/null || jq -c '{code: .code}' "$RUNNER_TEMP/claude-error.json" > "$f"
          elif [[ -f out/ci/voice-quota.json && "$(jq -r '.fallback // ""' out/ci/voice-quota.json 2>/dev/null)" != edge ]]; then
            echo '{"code":"voice_quota"}' > "$f"
          else
            step=""
            for pair in "setup:$OUT_SETUP" "script:$OUT_SCRIPT" "script:$OUT_GATE" "voice:$OUT_VOICE" "render:$OUT_RENDER" "cover:$OUT_COVER" "publish:$OUT_PUBLISH"; do
              if [[ "${pair#*:}" == failure ]]; then step=${pair%%:*}; break; fi
            done
            if [[ -z $step ]]; then
              for pair in "setup:$OUT_SETUP" "script:$OUT_SCRIPT" "voice:$OUT_VOICE" "render:$OUT_RENDER" "cover:$OUT_COVER" "publish:$OUT_PUBLISH"; do
                if [[ "${pair#*:}" == cancelled ]]; then step=${pair%%:*}; break; fi
              done
              if [[ -z $step && "$JOB_STATUS" == cancelled ]]; then step=timeout; fi
            fi
            if [[ -n $step ]]; then printf '{"code":"failed","step":"%s"}\n' "$step" > "$f"; else echo '{"code":"failed"}' > "$f"; fi
          fi
          echo "error.json: $(cat "$f")"

      - name: upload error.json
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: error.json
          path: ${{ runner.temp }}/error.json
          archive: false
          retention-days: 2
          if-no-files-found: warn
          overwrite: true # a re-run of the same run replaces its file
