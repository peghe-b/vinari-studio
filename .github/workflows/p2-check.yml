# Phase 2's check on its work branch (src/lib/p2.mjs): every push of studio-p2 runs the self-tests (npm run p2:test) and
# renders the settled frame of every shot of every P2 fixture (specs/demo-p2-*.json, silent demos: no voice, no key, no
# Claude) with the pixel guards (tools/ci/p2pixels.py), and keeps the stills and contact sheets as an artifact. The Mac is
# an 8 GB machine running one heavy job at a time, so the visual checks run here. Free: standard runners in a public repo,
# no secret is read. It never commits, never publishes and never counts toward the studio's daily cap (it is not studio.yml).
name: p2 check

on:
  push:
    branches: [studio-p2, main, r3-gltrans]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: restore browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/remotion-browser
          key: remotion-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: setup
        run: bash tools/ci/setup.sh

      - name: self-tests
        run: npm run p2:test

      # the GL transitions (src/lib/gltrans.mjs): WebGL 2 must draw headless on the runner's GL path (swangle: ANGLE on
      # SwiftShader); the probe still says which engine drew and compares every mask with its CPU twin
      # (tools/ci/glprobe.py), then every transition at five steps and the GL fixture's windows, each frame twice (the same
      # bytes: frame-deterministic)
      - name: GL transitions (headless WebGL probe, masks, the fixture's windows twice)
        if: always()
        env:
          VS_CI: "1"
          VS_GL: swangle
        run: node tools/gltrans-stills.mjs --out=out/gl

      - name: fixture stills and pixel guards
        if: always()
        env:
          VS_CI: "1"
          VS_GL: swangle
        # two fixtures' whole-film guards run twice: the gate's check must answer the same twice on this GL path
        run: node tools/p2-stills.mjs --repeat=demo-p2-data-v901,demo-p2-story-v904

      # the owner's master recipe (remotion.config.ts: CRF 12, aq-mode 3, 20 Mbps ceiling, level 4.2; the p2x technical judge,
      # 2026-10-27: the cloud films came out at CRF 16, level 5.0, 2.6-3.4 Mbps): two seconds of a fixture through the same
      # render, then the tags (tools/ci/publish.mjs encode: 30/1, yuv420p, bt709 x3, tv, level 4.2 at most)
      - name: encode recipe
        if: always()
        env:
          VS_GL: swangle
        shell: bash
        run: |
          mapfile -t flags < <(node tools/platform.mjs --flags-lines)
          npx remotion render src/index.ts demo-p2-data-v901 out/enc-check.mp4 --frames=0-59 --log=error "${flags[@]}"
          node tools/ci/publish.mjs encode out/enc-check.mp4

      - name: keep the GL stills
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gl-stills
          path: |
            out/gl/*.png
            out/gl/*.json
          retention-days: 5
          if-no-files-found: ignore

      - name: keep the stills
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p2-stills
          path: |
            out/p2/*.sheet.png
            out/p2/*.png
            out/p2/report.json
            out/p2/film-guards.json
          retention-days: 5
          if-no-files-found: ignore
