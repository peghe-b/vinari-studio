# Phase 2's check on its work branch (src/lib/p2.mjs): every push of studio-p2 runs the self-tests (npm run p2:test) and
# renders the settled frame of every shot of every P2 fixture (specs/demo-p2-*.json, silent demos: no voice, no key, no
# Claude) with the pixel guards (tools/ci/p2pixels.py), and keeps the stills and contact sheets as an artifact. The Mac is
# an 8 GB machine running one heavy job at a time, so the visual checks run here. Free: standard runners in a public repo,
# no secret is read. It never commits, never publishes and never counts toward the studio's daily cap (it is not studio.yml).
name: p2 check

on:
  push:
    # r3-*: the round-3 feature branches cut from studio-p2 (r3-judge, ...), each green before it is merged back
    branches: [studio-p2, main, "r3-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: restore browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/remotion-browser
          key: remotion-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: setup
        run: bash tools/ci/setup.sh

      - name: self-tests
        run: npm run p2:test

      - name: fixture stills and pixel guards
        if: always()
        env:
          VS_CI: "1"
          VS_GL: swangle
        # two fixtures' whole-film guards run twice: the gate's check must answer the same twice on this GL path
        run: node tools/p2-stills.mjs --repeat=demo-p2-data-v901,demo-p2-story-v904

      # the owner's master recipe (remotion.config.ts: CRF 12, aq-mode 3, 20 Mbps ceiling, level 4.2; the p2x technical judge,
      # 2026-10-27: the cloud films came out at CRF 16, level 5.0, 2.6-3.4 Mbps): two seconds of a fixture through the same
      # render, then the tags (tools/ci/publish.mjs encode: 30/1, yuv420p, bt709 x3, tv, level 4.2 at most)
      - name: encode recipe
        if: always()
        env:
          VS_GL: swangle
        shell: bash
        run: |
          mapfile -t flags < <(node tools/platform.mjs --flags-lines)
          npx remotion render src/index.ts demo-p2-data-v901 out/enc-check.mp4 --frames=0-59 --log=error "${flags[@]}"
          node tools/ci/publish.mjs encode out/enc-check.mp4

      # the judge's two images of a RENDERED film (tools/ci/judge.mjs, r3-judge) on this runner's own decode path (Remotion's
      # bundled ffmpeg, no ffmpeg on the PATH): the 1-frame-a-second sheet and the key-frame board of the two seconds above.
      # No look (no key is read here): the images only, kept with the stills
      - name: judge images
        if: always()
        shell: bash
        run: |
          [[ -f out/enc-check.mp4 ]] || { echo "no render to make the judge's images of"; exit 1; }
          mkdir -p out/p2/judge
          python3 tools/ci/adsheet.py out/enc-check.mp4 out/p2/judge/enc-check.sheet.png
          python3 tools/ci/keyframes.py out/enc-check.mp4 out/p2/judge/enc-check.keys.png --at "$(node -e "import('./tools/ci/judge.mjs').then((m) => { const s = JSON.parse(require('fs').readFileSync('specs/demo-p2-data-v901.json', 'utf8')); const k = m.keyFramesOf({...m.shotsOf(s), total: 60}); console.log(m.atArg(k)); })")"
          python3 -c "from PIL import Image; import sys; [print(f, Image.open(f).size) for f in sys.argv[1:]]" out/p2/judge/enc-check.sheet.png out/p2/judge/enc-check.keys.png
          # every key frame decoded, the clip's last one too (a seek onto the last frame decoded nothing on the first run)
          python3 tools/ci/keyframes.py out/enc-check.mp4 out/p2/judge/enc-check.end.png --at 0:first,59:last | tee /dev/stderr | grep -q "2 of 2 frames"

      - name: keep the stills
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p2-stills
          path: |
            out/p2/*.sheet.png
            out/p2/*.png
            out/p2/report.json
            out/p2/film-guards.json
            out/p2/judge/*.png
          retention-days: 5
          if-no-files-found: ignore
